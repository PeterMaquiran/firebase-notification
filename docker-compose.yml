version: "3.8"

services:
  firebase-notifications:
    image: registry.tvone.ao/firebase-notifications:latest
    environment:
      - PORT=3000
      - GOOGLE_APPLICATION_CREDENTIALS=/vault/secrets/serviceAccountKey.json
    volumes:
      - ./secrets:/vault/secrets:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    networks:
      - web-network

networks:
  web-network:
    external: true